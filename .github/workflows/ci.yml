name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing left to say; only the newest one per branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The suite runs TypeScript through node:test, which needs the
          # unflagged type stripping of Node 22.18+. The published CLI is
          # plain JS and still supports the engines floor of Node 20.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    # Nothing is ever published from a red build.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump and CHANGELOG, push the tag
      issues: write # comment on issues the release closes
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the whole history to work out the bump, and
          # authenticates with its own token rather than the checkout's.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
